name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The checks every primitive shares live in the runner repo, at the release
# whose primitive contract this primitive is built against. runner-ref names
# the same release: the workflow reads the contract and the declaration check
# from it.
jobs:
  ci:
    uses: uniconhq/runner/.github/workflows/primitive-ci.yaml@v0.6.0
    with:
      runner-ref: v0.6.0
      compile-image: true
