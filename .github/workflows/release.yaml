name: release

on:
  push:
    tags: ["v*"]

permissions: {}

# The release every primitive shares lives in the runner repo, at the release
# whose primitive contract this primitive is built against. It checks the
# tag, runs the same checks as CI, pushes the tested image and writes the
# GitHub release; each of its jobs takes only the part of these permissions
# it needs.
jobs:
  release:
    uses: uniconhq/runner/.github/workflows/primitive-release.yaml@v0.4.0
    permissions:
      contents: write
      packages: write
    with:
      runner-ref: v0.4.0
      compile-image: true
